<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Tic-Tac-Toe</h1>

    <div class="controls">
      <label>
        Mode
        <select id="mode">
          <option value="pvp">2 Players</option>
          <option value="cpu">vs Computer</option>
        </select>
      </label>
      <label id="difficulty-label" hidden>
        Difficulty
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="hard">Hard (unbeatable)</option>
        </select>
      </label>
    </div>

    <p id="status" aria-live="polite">Player X's turn</p>

    <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board"></div>

    <div class="scoreboard">
      <div>X <span id="score-x">0</span></div>
      <div>Draws <span id="score-draw">0</span></div>
      <div>O <span id="score-o">0</span></div>
    </div>

    <div class="buttons">
      <button id="restart">New Game</button>
      <button id="reset-scores" class="secondary">Reset Scores</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
